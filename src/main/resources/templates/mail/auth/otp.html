<!doctype html>
<html lang="ko">
<head>
    <title>이메일 인증</title>
    <meta charset="UTF-8"/>
</head>
<body style="margin:0;padding:0;background:#f6f7fb;">
<div style="max-width:560px;margin:0 auto;padding:24px;">
    <div style="background:#ffffff;border-radius:12px;padding:28px;border:1px solid #e9ecf3;">
        <h2 style="margin:0 0 12px 0;"
            th:text="${subject}">
            회원가입 이메일 인증번호 안내
        </h2>

        <p style="margin:0 0 18px 0;line-height:1.6;color:black;"
           th:text="${description}">
            회원가입을 위해 이메일 인증을 진행합니다.
        </p>

        <div style="margin:18px 0;padding:16px;border-radius:10px;background:#f3f6ff;border:1px solid #dfe7ff;">
            <div style="font-size:16px;color:black;margin-bottom:6px;">인증 번호</div>
            <div style="font-size:28px;font-weight:400;letter-spacing:2px;color:#1f2a44;"
                 th:text="${otp}">123456</div>
        </div>

        <p style="margin:0 0 10px 0;line-height:1.6;color:black;">
            발급된 이메일 인증번호를 복사하거나 직접 입력하여 인증을 완료해주세요.
        </p>

        <p style="margin:0;color:black;line-height:1.6;">
            개인정보 보호를 위해 인증번호는
            <b th:text="${expiresInMinutes}">5</b>분간 유효합니다.
        </p>
    </div>
</div>
</body>
</html>
