<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>회원가입</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <link th:href="@{/auth/css/signup.css}" rel="stylesheet" />
</head>

<body>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">

            <div class="card shadow-sm signup-card">
                <div class="card-body p-4 p-md-5">
                    <h1 class="h4 mb-4 text-center">회원가입</h1>

                    <div id="globalErrorJs" class="alert alert-danger py-2" role="alert" hidden></div>

                    <form id="signupForm"
                          th:action="@{/auth/signup}"
                          th:object="${signupFormData}"
                          method="post"
                          novalidate>

                        <!-- CSRF(있을 경우) -->
                        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                        <!-- 글로벌 에러 영역 (Controller/JS 공통) -->
                        <div id="globalError" class="alert alert-danger py-2" role="alert"
                             th:if="${globalError != null or #fields.hasGlobalErrors()}"
                             th:text="${globalError != null ? globalError : #fields.globalErrors()[0].defaultMessage}">
                        </div>

                        <!-- 아이디 -->
                        <div class="mb-3">
                            <label for="username" class="form-label">아이디</label>
                            <input id="username"
                                   type="text"
                                   class="form-control"
                                   th:field="*{username}"
                                   autocomplete="username"
                                   inputmode="text"
                                   aria-describedby="usernameFeedback" />
                            <div id="usernameFeedback" class="field-feedback"
                                 th:text="${#fields.hasErrors('username') ? #fields.errors('username')[0] : ''}">
                            </div>
                        </div>

                        <!-- 비밀번호 + 토글 아이콘 -->
                        <div class="mb-3">
                            <label for="password" class="form-label">비밀번호</label>

                            <div class="position-relative">
                                <input id="password"
                                       type="password"
                                       class="form-control pe-5"
                                       th:field="*{password}"
                                       autocomplete="new-password"
                                       aria-describedby="passwordFeedback" />

                                <span id="togglePasswordBtn"
                                      class="password-toggle"
                                      role="button"
                                      tabindex="-1"
                                      aria-label="비밀번호 보기/숨기기"
                                      aria-pressed="false">
                  <i id="togglePasswordIcon" class="bi bi-eye-slash" aria-hidden="true"></i>
                </span>
                            </div>

                            <div id="passwordFeedback" class="field-feedback"
                                 th:text="${#fields.hasErrors('password') ? #fields.errors('password')[0] : ''}">
                            </div>
                        </div>

                        <!-- 이메일 + 이메일 인증 버튼 -->
                        <div class="mb-3">
                            <label for="email" class="form-label">이메일</label>

                            <div class="d-flex gap-2">
                                <input id="email"
                                       type="email"
                                       class="form-control"
                                       th:field="*{email}"
                                       autocomplete="email"
                                       inputmode="email"
                                       aria-describedby="emailFeedback" />

                                <button type="button"
                                        id="sendOtpBtn"
                                        class="btn btn-outline-secondy btn-outline-secondary flex-shrink-0"
                                        disabled>
                                    이메일 인증
                                </button>
                            </div>

                            <div id="emailFeedback" class="field-feedback"
                                 th:text="${#fields.hasErrors('email') ? #fields.errors('email')[0] : ''}">
                            </div>
                        </div>

                        <!-- OTP 입력 + 인증하기 버튼 -->
                        <div class="mb-2">
                            <label for="otp" class="form-label">인증번호(6자리)</label>

                            <div class="d-flex gap-2">
                                <input id="otp"
                                       type="text"
                                       class="form-control"
                                       name="otp"
                                       inputmode="numeric"
                                       maxlength="6"
                                       disabled
                                       aria-describedby="otpFeedback" />

                                <button type="button"
                                        id="verifyOtpBtn"
                                        class="btn btn-outline-primary flex-shrink-0"
                                        disabled>
                                    인증하기
                                </button>
                            </div>

                            <div id="otpFeedback" class="field-feedback"></div>

                            <div id="otpTimers" class="mt-1" hidden>
                                <small class="text-secondary">남은시간 <span id="otpTimer">--:--</span></small>
                                <small class="text-secondary ms-2">재전송 <span id="resendTimer">--:--</span></small>
                            </div>
                        </div>

                        <!-- 닉네임 -->
                        <div class="mb-3 mt-3">
                            <label for="nickname" class="form-label">닉네임</label>
                            <input id="nickname"
                                   type="text"
                                   class="form-control"
                                   th:field="*{nickname}"
                                   autocomplete="nickname"
                                   aria-describedby="nicknameFeedback" />
                            <div id="nicknameFeedback" class="field-feedback"
                                 th:text="${#fields.hasErrors('nickname') ? #fields.errors('nickname')[0] : ''}">
                            </div>
                        </div>

                        <div class="d-grid mt-4">
                            <button id="signupBtn" type="submit" class="btn btn-outline-primary">
                                회원 가입
                            </button>
                        </div>

                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
<script th:src="@{/auth/js/signup.js}" defer></script>
</body>
</html>
